services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bouncer:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    # Mount source for dev so code changes don't require a rebuild.
    volumes:
      - ./src:/app/src
    command: npm run dev
