services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Dev stub backend: echoes the request it receives (proves forwarding worked).
  backend:
    image: traefik/whoami
    ports:
      - "8080:80"

  bouncer:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:80
    depends_on:
      - redis
      - backend
