services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # RabbitMQ for v2 (tiered prioritization). -management adds a UI at :15672.
  # guest is localhost-only, so define dev creds usable across containers.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # management UI
    environment:
      - RABBITMQ_DEFAULT_USER=bouncer
      - RABBITMQ_DEFAULT_PASS=bouncer
    # Bouncer connects on startup and fails fast, so wait until RabbitMQ is ready.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Dev stub backend: echoes requests (via /anything) and can respond slowly
  # (via /delay/N) — the slow path drives the v2 overload/priority demo.
  backend:
    image: mccutchen/go-httpbin
    ports:
      - "8080:8080"

  bouncer:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:8080
      - RABBITMQ_URL=amqp://bouncer:bouncer@rabbitmq:5672
      # Low cap so the v2 overload/priority behavior is visible out of the box.
      - MAX_IN_FLIGHT=10
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
