# Test overrides, layered on top of docker-compose.yml by CI and `npm run ci:local`:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
# A tiny T2 queue makes queue-full shedding testable with a handful of requests.
# It stays out of the base file so `npm run loadtest` / `npm run demo` (T1 + T3
# bursts, plus a T2 burst in the loadtest) run against the realistic default.
services:
  bouncer:
    environment:
      - MAX_QUEUE_LENGTH_T2=5
